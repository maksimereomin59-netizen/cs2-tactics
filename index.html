<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>CS2 Плейбук команды</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">🎯 <b>CS2</b>&nbsp;Плейбук</a>
    <div class="topbtns">
      <button id="editBtn" class="ibtn" title="Режим капитана: править ники, позиции, гранаты">✏️</button>
    </div>
  </header>
  <div id="editPanel" class="editpanel" hidden>
    <span>Режим капитана: текст правится тапом, маркеры игроков перетаскиваются на схеме.</span>
    <div class="row">
      <button class="btn tiny" id="expBtn">Экспорт</button>
      <button class="btn tiny ghost" id="impBtn">Импорт</button>
      <button class="btn tiny ghost" id="rstBtn">Сброс</button>
    </div>
  </div>
  <main id="view"></main>
  <footer class="foot">Плейбук хранится на телефоне · офлайн работает · сделано для турнира</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
