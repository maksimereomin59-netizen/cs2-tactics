<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13">
  <meta name="description" content="CS2 Team Playbook — тактики, схемы, раскидки и видео команды.">
  <title>CS2 Team Playbook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css?v=13">
  <script>
    /* Старая версия ставила service worker, который кэшировал файлы. Его больше нет,
       но установленный он продолжил бы отдавать старую вёрстку — снимаем регистрацию
       и чистим кэш. На данных команды это не сказывается: они в localStorage/Supabase. */
    (function () {
      try {
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          })["catch"](function () {});
        }
        if (window.caches && window.caches.keys) {
          window.caches.keys().then(function (ks) {
            ks.forEach(function (k) { window.caches["delete"](k); });
          })["catch"](function () {});
        }
      } catch (e) { /* браузер без поддержки SW — ничего делать не нужно */ }
    })();
  </script>
</head>
<body>
  <a class="skiplink" href="#view">К содержимому</a>

  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/overview" title="Обзор">
      <span class="brand-mark">CS2</span>
      <span class="brand-name" id="brandTeam">—</span>
    </a>
    <div class="topbar-right">
      <span class="savestate" id="saveState" hidden></span>
      <span class="netdot" id="netDot" title="Соединение"></span>
      <button class="btn btn-icon" id="searchBtn" type="button" title="Поиск" aria-label="Поиск"></button>
      <span class="rolebadge" id="roleBadge">Игрок</span>
      <button class="whoami topbar-who" id="topProfile" type="button" title="Профиль"></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" hidden>
      <nav class="nav" id="sideNav" aria-label="Разделы"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <main class="view" id="view">
      <div class="loading" role="status"><span class="spinner"></span>Загрузка…</div>
    </main>
  </div>

  <nav class="bottomnav" id="bottomNav" hidden aria-label="Разделы"></nav>

  <div class="sheet-root" id="sheetRoot" hidden></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="viewer-root" id="viewerRoot" hidden></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>

  <script src="supabase-config.js"></script>
  <script src="data.js?v=13"></script>
  <script src="db.js?v=13"></script>
  <script src="ui.js?v=13"></script>
  <script src="board.js?v=13"></script>
  <script src="seed.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
