<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f13">
  <title>CS2 Плейбук команды</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preload" as="image" href="assets/maps/mirage.png?v=6">
  <link rel="preload" as="image" href="assets/maps/ancient.png?v=6">
  <link rel="preload" as="image" href="assets/maps/dust2.png?v=6">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="На главную">
      <span class="logo-mark">CS2</span>
      <span class="logo-name">Плейбук команды</span>
    </a>
    <div class="top-actions">
      <a class="top-link" href="#/bomb" title="Таймер установленной бомбы">Бомба · 40 сек</a>
      <button id="editBtn" class="captain-btn" type="button">Режим капитана</button>
    </div>
  </header>

  <aside id="editPanel" class="editpanel" hidden>
    <div class="editpanel-inner">
      <div class="captain-state"><span class="status-dot"></span><b>Редактирование включено</b><span>Все изменения сохраняются автоматически</span></div>
      <div class="panel-actions">
        <button class="panel-btn" id="expBtn" type="button">Экспорт</button>
        <button class="panel-btn" id="impBtn" type="button">Импорт</button>
        <button class="panel-btn" id="passBtn" type="button">Сменить пароль</button>
        <button class="panel-btn danger" id="rstBtn" type="button">Сбросить</button>
      </div>
    </div>
  </aside>

  <main id="view"><div class="startup"><span class="startup-dot"></span>Загрузка плейбука…</div></main>

  <footer class="foot">
    <span>CS2 Плейбук команды</span>
    <span>Изменения хранятся на этом устройстве</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
