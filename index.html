<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0e">
  <title>CS2 Tactical Playbook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="На главную">
      <span class="logo-mark">CS2</span>
      <span class="logo-name">TACTICAL PLAYBOOK</span>
    </a>
    <div class="top-actions">
      <a class="top-link" href="#/bomb" title="Таймер установленной бомбы">BOMB · 40S</a>
      <button id="editBtn" class="captain-btn" type="button" aria-label="Войти в режим капитана">КАПИТАН · ВХОД</button>
    </div>
  </header>

  <aside id="editPanel" class="editpanel" hidden>
    <div class="editpanel-inner">
      <div class="captain-state"><span class="status-dot"></span><b>CAPTAIN MODE</b><span>Редактирование разблокировано</span></div>
      <div class="panel-actions">
        <button class="panel-btn" id="expBtn" type="button">ЭКСПОРТ</button>
        <button class="panel-btn" id="impBtn" type="button">ИМПОРТ</button>
        <button class="panel-btn" id="passBtn" type="button">СМЕНИТЬ ПАРОЛЬ</button>
        <button class="panel-btn danger" id="rstBtn" type="button">СБРОСИТЬ ДАННЫЕ</button>
      </div>
    </div>
  </aside>

  <main id="view"></main>

  <footer class="foot">
    <span>CS2 TACTICAL PLAYBOOK</span>
    <span>ДАННЫЕ ХРАНЯТСЯ ЛОКАЛЬНО · OFFLINE READY</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
